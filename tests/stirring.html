<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Tray circulation checks</title>
<style>body{font:13px monospace;background:#111;color:#ddd}pre{white-space:pre-wrap}canvas{width:360px;height:360px}#samples{display:flex;flex-wrap:wrap;gap:12px}figure{margin:0}figcaption{padding:8px}</style>
<h1>Tray circulation checks</h1><pre>Running…</pre><div id="samples"></div><canvas id="live"></canvas>
<script type="module">
import { FluidBowl } from '/lib/fluid.ts';
const output=document.querySelector('pre'),results=[],params=new URLSearchParams(location.search);
let e;
function check(label,ok,details){results.push(`${ok?'PASS':'FAIL'} ${label}: ${JSON.stringify(details)}`);output.textContent=results.join('\n');if(!ok)throw new Error(label);}
function read(target){const gl=e.gl;gl.bindFramebuffer(gl.FRAMEBUFFER,target.buffer);const data=new Float32Array(target.size**2*4);gl.readPixels(0,0,target.size,target.size,gl.RGBA,gl.FLOAT,data);return data;}
function stats(){
  const phase=read(e.dye.read),n=e.dye.read.size,velocity=read(e.mixingVelocity.read),height=read(e.mixingSurface.read),geometry=read(e.boundaryGeometry),m=e.simSize;
  let sum=0,count=0,perimeter=0,min=1,max=0,outside=0,mass=0,area=0,angular=0,speed=0;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    const i=(y*n+x)*4,c=phase[i];
    if(Math.hypot((x+.5)/n-.5,(y+.5)/n-.5)>=e.boundaryRadius){outside=Math.max(outside,Math.abs(c));continue;}
    sum+=c;count++;min=Math.min(min,c);max=Math.max(max,c);
    for(const [dx,dy] of [[1,0],[0,1]])if(Math.hypot((x+dx+.5)/n-.5,(y+dy+.5)/n-.5)<e.boundaryRadius&&((c>.5)!==(phase[((y+dy)*n+x+dx)*4]>.5)))perimeter++;
  }
  for(let y=0;y<m;y++)for(let x=0;x<m;x++){
    const i=(y*m+x)*4,a=geometry[i+2];if(a<=.00001)continue;
    const px=(x+.5)/m-.5,py=(y+.5)/m-.5;
    area+=a;mass+=a*height[i];angular+=a*(px*velocity[i+1]-py*velocity[i]);speed+=a*(velocity[i]**2+velocity[i+1]**2);
  }
  return {mean:sum/count,perimeter,min,max,outside,heightMean:mass/area,angular:angular/area,speed:Math.sqrt(speed/area),drive:e.stirring};
}
function capture(label){e.render();const figure=document.createElement('figure'),image=document.createElement('canvas');image.width=e.canvas.width;image.height=e.canvas.height;image.getContext('2d').drawImage(e.canvas,0,0);const caption=document.createElement('figcaption');caption.textContent=label;figure.append(image,caption);document.querySelector('#samples').append(figure);}
try{
  let baseline, baselineWaves;
  const seconds=params.has('long')?60:16;
  for(const stirring of [false,true]){
    const live=document.createElement('canvas');document.querySelector('#live').replaceWith(live);live.id='live';
    e=new FluidBowl(live,{stirring,dissolving:false,quality:params.has('performance')?'performance':'detail',displayFiltering:params.has('manual')?'manual':undefined});cancelAnimationFrame(e.frame);e.intersectionObserver.disconnect();e.resizeObserver.disconnect();
    if(params.has('max')){e.setWaveStrength(3);e.setWaveViscosity(4);}
    e.draw('init',e.dye.read,{seed:9.7});e.anchorMaterial();const start=stats();
    check('Initial state '+stirring,Number.isFinite(start.heightMean)&&start.mean>.1,start);
    if(stirring)capture('Initial phases');
    let clock=1000;e.lastTime=clock;
    async function advance(seconds,sign){
      for(let i=0;i<seconds*60;i++){
        const t=i/60;clock+=1000/60;e.visible=true;e.setTilt(sign?{x:.85*Math.cos(t*2.4),y:sign*.85*Math.sin(t*2.4)}:{x:0,y:0});e.tick(clock);cancelAnimationFrame(e.frame);
        if(i%60===59){const s=stats();if(!Number.isFinite(s.heightMean)||Math.abs(s.heightMean)>=.00002)check('Stable second '+Math.round((clock-1000)/1000)+' / '+stirring,false,s);}
        if(i%12===0)await new Promise(requestAnimationFrame);
      }
    }
    await advance(seconds,1);const stirred=stats();capture(`${seconds} s, circulation ${stirring?'on':'off'}`);
    check('Bounded phases and conserved area/height '+stirring,Math.abs(stirred.mean-start.mean)<.00002&&Math.abs(stirred.heightMean-start.heightMean)<.00002&&stirred.min>=-.000001&&stirred.max<=1.000001&&stirred.outside===0,stirred);
    if(!stirring){baseline=stirred;baselineWaves=read(e.surface.read);}
    else{
      const waves=read(e.surface.read);let waveError=0;for(let i=0;i<waves.length;i++)waveError=Math.max(waveError,Math.abs(waves[i]-baselineWaves[i]));
      check('Visible waves are independent of material circulation',waveError<.0000001,waveError);
      e.setEffects(['crests']);capture('Same circulation with Hřebeny');e.setEffects([]);
      check('Circulation stretches more interface than translation alone',stirred.perimeter>baseline.perimeter*1.25,{baseline:baseline.perimeter,stirred:stirred.perimeter});
      check('Clockwise gesture produces real clockwise fluid momentum',stirred.angular<-.005,stirred.angular);
      await advance(6,-1);const reversed=stats();capture('6 s, reversed gesture');
      check('Opposite gesture reverses the fluid momentum',reversed.angular>.005,reversed.angular);
      await advance(12,0);const rest=stats();capture('12 s, at rest');
      check('Motor and circulation die away after release',Math.abs(rest.drive)<.000001&&Math.abs(rest.angular)<Math.abs(reversed.angular)*.02,rest);
      check('Rest retains both materials and total height',Math.abs(rest.mean-start.mean)<.00002&&Math.abs(rest.heightMean-start.heightMean)<.00002&&rest.min>=-.000001&&rest.max<=1.000001,rest);
    }
    check('No WebGL errors '+stirring,e.gl.getError()===e.gl.NO_ERROR,null);e.dispose();e=null;
  }
  output.textContent+='\nDONE';
}catch(error){output.textContent+='\nERROR '+error.stack;}finally{e?.dispose();}
</script></html>
