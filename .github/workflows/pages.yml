name: Deploy application to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Test iPad motion controls
        run: |
          npx tsc tests/device-tilt.test.ts tests/stirring.test.ts --module commonjs --target ES2022 --types node --esModuleInterop --skipLibCheck --outDir "$RUNNER_TEMP/michas-sensor-tests"
          node --test "$RUNNER_TEMP/michas-sensor-tests/tests/"*.test.js
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Designblok-ADD-kase
          NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}
      - run: test -f dist/client/index.html
      - name: Build public side display previews
        run: |
          npm run build:ios
          mkdir -p dist/client/displays
          cp native/ios/Michas/Web/index.html native/ios/Michas/Web/app.css native/ios/Michas/Web/app.iife.js dist/client/displays/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy application
        id: deployment
        uses: actions/deploy-pages@v4
